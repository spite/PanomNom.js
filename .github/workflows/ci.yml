name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # npm ci, not npm install: the bundle check below compares against output
      # from one exact esbuild version, so the lockfile has to be honoured.
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Fail if the committed bundles are out of date
        run: git diff --exit-code -- build/
