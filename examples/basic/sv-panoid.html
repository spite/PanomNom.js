<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Street View from an id · PanomNom.js</title>
    <link rel="stylesheet" href="demo.css" />
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
    </script>
  </head>
  <body>
    <main>
      <nav><a href="./">← All examples</a> · <a href="https://github.com/spite/PanomNom.js/blob/master/examples/basic/sv-panoid.html">Source</a></nav>
      <h1>Street View from an id <code>GoogleStreetViewLoader.load</code></h1>
      <p>Loads a Street View panorama from its id, stitching the tiles into one equirectangular canvas. Pick a zoom level: each one doubles the size, from 832 × 416 at zoom 1 to 13312 × 6656 at zoom 5.</p>
      <div id="demo"></div>
    </main>
    <script src="https://maps.google.com/maps/api/js"></script>
    <script type="module">
      import { GoogleStreetViewLoader } from "../../src/PanomNom.js";
      import { createDemo } from "./demo.js";
      import { PANORAMAS } from "./places.js";

      // Street View imagery belongs to Google, and the metadata says so.
      const credit = (metadata) => `Street View data ${metadata.copyright}`;

      const loader = new GoogleStreetViewLoader();

      createDemo({
        label: "Panorama id",
        placeholder: "A Street View panorama id",
        examples: PANORAMAS,
        async load(id, { zoom, progress }) {
          loader.onProgress(progress);
          await loader.load(id, zoom);
          return { canvas: loader.canvas, credit: credit(loader.metadata), name: id };
        },
      });
    </script>
  </body>
</html>
