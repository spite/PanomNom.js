<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Street View from a Maps URL · PanomNom.js</title>
    <link rel="stylesheet" href="demo.css" />
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
    </script>
  </head>
  <body>
    <main>
      <nav><a href="./">← All examples</a> · <a href="https://github.com/spite/PanomNom.js/blob/master/examples/basic/sv-url.html">Source</a></nav>
      <h1>Street View from a Maps URL <code>getIdFromURL</code></h1>
      <p>Open Street View in Google Maps and paste the address: <code>getIdFromURL</code> finds the panorama id in it, and the loader does the rest.</p>
      <div id="demo"></div>
    </main>
    <script src="https://maps.google.com/maps/api/js"></script>
    <script type="module">
      import { GoogleStreetViewLoader, getIdFromURL } from "../../src/PanomNom.js";
      import { createDemo } from "./demo.js";
      import { PANORAMAS, mapsURL } from "./places.js";

      // Street View imagery belongs to Google, and the metadata says so.
      const credit = (metadata) => `Street View data ${metadata.copyright}`;

      const loader = new GoogleStreetViewLoader();

      createDemo({
        label: "Google Maps URL",
        placeholder: "https://www.google.com/maps/@…",
        examples: PANORAMAS.map((p) => [mapsURL(p), p[1]]),
        async load(url, { zoom, progress }) {
          const id = getIdFromURL(url);
          loader.onProgress(progress);
          await loader.load(id, zoom);
          return { canvas: loader.canvas, credit: credit(loader.metadata), name: id };
        },
      });
    </script>
  </body>
</html>
